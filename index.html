<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KidsFinance & Gear Tracker</title>

  <!-- Modernes Flohmarktstand Favicon & App Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%234F46E5'/><path d='M8 26 L14 11 Q16 8 20 8 L44 8 Q48 8 50 11 L56 26 Z' fill='%23F43F5E'/><path d='M20 8 L17 26 L26 26 L28 8 Z' fill='%23FFFFFF' opacity='0.9'/><path d='M38 8 L36 26 L45 26 L47 8 Z' fill='%23FFFFFF' opacity='0.9'/><path d='M8 26 Q12 30 16 26 Q20 30 24 26 Q28 30 32 26 Q36 30 40 26 Q44 30 48 26 Q52 30 56 26' fill='%23E11D48'/><line x1='14' y1='26' x2='14' y2='52' stroke='%23C7D2FE' stroke-width='3' stroke-linecap='round'/><line x1='50' y1='26' x2='50' y2='52' stroke='%23C7D2FE' stroke-width='3' stroke-linecap='round'/><rect x='10' y='38' width='44' height='15' rx='3' fill='%23FFFFFF'/><rect x='10' y='38' width='44' height='4' rx='1' fill='%23E0E7FF'/><circle cx='23' cy='46' r='3.5' fill='%23F59E0B'/><rect x='34' y='43' width='14' height='6' rx='2' fill='%2310B981'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%234F46E5'/><path d='M8 26 L14 11 Q16 8 20 8 L44 8 Q48 8 50 11 L56 26 Z' fill='%23F43F5E'/><path d='M20 8 L17 26 L26 26 L28 8 Z' fill='%23FFFFFF' opacity='0.9'/><path d='M38 8 L36 26 L45 26 L47 8 Z' fill='%23FFFFFF' opacity='0.9'/><path d='M8 26 Q12 30 16 26 Q20 30 24 26 Q28 30 32 26 Q36 30 40 26 Q44 30 48 26 Q52 30 56 26' fill='%23E11D48'/><line x1='14' y1='26' x2='14' y2='52' stroke='%23C7D2FE' stroke-width='3' stroke-linecap='round'/><line x1='50' y1='26' x2='50' y2='52' stroke='%23C7D2FE' stroke-width='3' stroke-linecap='round'/><rect x='10' y='38' width='44' height='15' rx='3' fill='%23FFFFFF'/><rect x='10' y='38' width='44' height='4' rx='1' fill='%23E0E7FF'/><circle cx='23' cy='46' r='3.5' fill='%23F59E0B'/><rect x='34' y='43' width='14' height='6' rx='2' fill='%2310B981'/></svg>">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <!-- Passendes Flohmarktstand-Icon auch im Header -->
        <span class="text-2xl text-indigo-200">
          <i class="fa-solid fa-shop"></i>
        </span>
        <div>
          <h1 class="text-xl md:text-2xl font-bold tracking-tight">KidsGear Tracker</h1>
          <p class="text-xs text-indigo-200 hidden sm:block">Flohmarkt, Kaufen & Verkaufen im Überblick</p>
        </div>
      </div>
      
      <div class="flex items-center flex-wrap gap-2">
        <!-- Backup Buttons -->
        <button onclick="exportBackup()" title="Backup als Datei herunterladen" class="bg-indigo-700 hover:bg-indigo-800 text-indigo-100 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-download"></i> Backup
        </button>
        <button onclick="triggerImport()" title="Backup-Datei wiederherstellen" class="bg-indigo-700 hover:bg-indigo-800 text-indigo-100 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-upload"></i> Import
        </button>
        <input type="file" id="import-file-input" accept=".json" class="hidden" onchange="handleImportFile(event)">

        <!-- Neuer Eintrag -->
        <button onclick="openModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2 text-sm ml-auto sm:ml-2">
          <i class="fa-solid fa-plus"></i> Neuer Eintrag
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

    <!-- KPI Dashboard / Finanzen -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs uppercase font-bold tracking-wider text-slate-400">Ausgaben (Gekauft)</p>
          <h2 id="total-spent" class="text-2xl font-extrabold text-rose-500 mt-1">0,00 €</h2>
        </div>
        <div class="w-12 h-12 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center text-xl">
          <i class="fa-solid fa-arrow-down"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs uppercase font-bold tracking-wider text-slate-400">Einnahmen (Verkauft)</p>
          <h2 id="total-earned" class="text-2xl font-extrabold text-emerald-500 mt-1">0,00 €</h2>
        </div>
        <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center text-xl">
          <i class="fa-solid fa-arrow-up"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs uppercase font-bold tracking-wider text-slate-400">Netto-Kosten (Differenz)</p>
          <h2 id="total-balance" class="text-2xl font-extrabold text-slate-700 mt-1">0,00 €</h2>
        </div>
        <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center text-xl">
          <i class="fa-solid fa-scale-balanced"></i>
        </div>
      </div>
    </div>

    <!-- Filter & Suche -->
    <div class="flex flex-col md:flex-row gap-3 items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
        <input type="text" id="search-input" oninput="renderItems()" placeholder="Artikel oder Details suchen..." 
               class="w-full pl-9 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border-slate-300">
      </div>
      <div class="flex gap-2 w-full md:w-auto">
        <select id="status-filter" onchange="renderItems()" class="w-full md:w-auto px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 border-slate-300 bg-white">
          <option value="all">Alle Artikel anzeigen</option>
          <option value="active">Nur in Besitz</option>
          <option value="sold">Nur Verkaufte</option>
        </select>
      </div>
    </div>

    <!-- Artikel-Liste -->
    <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Wird via JS befüllt -->
    </div>
  </main>

  <!-- Modal zum Hinzufügen / Bearbeiten -->
  <div id="item-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <h3 id="modal-title" class="text-lg font-bold mb-4">Neuen Artikel erfassen</h3>
      
      <form id="item-form" onsubmit="saveItem(event)" class="space-y-4">
        <input type="hidden" id="item-id">

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Titel / Artikelname *</label>
          <input type="text" id="item-title" required placeholder="z. B. Winterjacke Gr. 98, Laufrad..." class="w-full border rounded-lg px-3 py-2 border-slate-300 focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Beschreibung / Notizen</label>
          <textarea id="item-desc" rows="2" placeholder="Zustand, Größe, Marke, wo verstaut..." class="w-full border rounded-lg px-3 py-2 border-slate-300 focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Kaufpreis (€) *</label>
            <input type="number" id="item-buy-price" step="0.01" min="0" required placeholder="0.00" class="w-full border rounded-lg px-3 py-2 border-slate-300 focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Kaufdatum</label>
            <input type="date" id="item-date" class="w-full border rounded-lg px-3 py-2 border-slate-300 focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <!-- Foto Upload -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Foto</label>
          <input type="file" id="item-image" accept="image/*" onchange="handleImage(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <input type="hidden" id="item-image-base64">
          <div id="image-preview-wrapper" class="mt-2 hidden relative w-24 h-24 rounded-lg overflow-hidden border">
            <img id="image-preview" src="" alt="Vorschau" class="w-full h-full object-cover">
            <button type="button" onclick="removeImage()" class="absolute top-1 right-1 bg-rose-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">✕</button>
          </div>
        </div>

        <!-- Verkauf-Sektion -->
        <div class="border-t pt-4">
          <div class="flex items-center gap-2 mb-3">
            <input type="checkbox" id="item-is-sold" onchange="toggleSoldInputs()" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
            <label for="item-is-sold" class="text-sm font-semibold text-slate-700 cursor-pointer">Bereits wieder verkauft?</label>
          </div>

          <div id="sold-fields" class="hidden">
            <label class="block text-sm font-medium text-slate-700 mb-1">Verkaufspreis (€)</label>
            <input type="number" id="item-sell-price" step="0.01" min="0" placeholder="0.00" class="w-full border rounded-lg px-3 py-2 border-slate-300 focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg hover:bg-slate-50 font-medium">Abbrechen</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'kids_gear_tracker_data';
    let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // Formatierungshilfe für Euro
    const formatEUR = (num) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(num);

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      calculateTotals();
      renderItems();
    }

    function calculateTotals() {
      let spent = 0;
      let earned = 0;

      items.forEach(item => {
        spent += parseFloat(item.buyPrice || 0);
        if (item.isSold) {
          earned += parseFloat(item.sellPrice || 0);
        }
      });

      const net = spent - earned;

      document.getElementById('total-spent').innerText = formatEUR(spent);
      document.getElementById('total-earned').innerText = formatEUR(earned);
      document.getElementById('total-balance').innerText = formatEUR(net);
    }

    function renderItems() {
      const container = document.getElementById('items-grid');
      const search = document.getElementById('search-input').value.toLowerCase();
      const filter = document.getElementById('status-filter').value;

      container.innerHTML = '';

      const filtered = items.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(search) || (item.desc && item.desc.toLowerCase().includes(search));
        if (!matchesSearch) return false;

        if (filter === 'active') return !item.isSold;
        if (filter === 'sold') return item.isSold;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-400">
            <i class="fa-solid fa-box-open text-4xl mb-3"></i>
            <p>Keine Einträge vorhanden.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white border rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between";

        const imagePlaceholder = item.image 
          ? `<img src="${item.image}" alt="${item.title}" class="w-full h-44 object-cover">`
          : `<div class="w-full h-44 bg-slate-100 flex items-center justify-center text-slate-300"><i class="fa-regular fa-image text-3xl"></i></div>`;

        const badge = item.isSold 
          ? `<span class="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold">Verkauft (+${formatEUR(item.sellPrice)})</span>`
          : `<span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-full font-semibold">Im Besitz</span>`;

        card.innerHTML = `
          <div>
            ${imagePlaceholder}
            <div class="p-4">
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-lg text-slate-800 leading-tight">${item.title}</h3>
                ${badge}
              </div>
              <p class="text-sm text-slate-500 mb-3 line-clamp-2">${item.desc || '<em>Keine Beschreibung</em>'}</p>
              
              <div class="text-xs text-slate-400 flex justify-between py-1 border-t">
                <span>Gekauft für:</span>
                <span class="font-semibold text-slate-700">${formatEUR(item.buyPrice)}</span>
              </div>
              ${item.isSold ? `
              <div class="text-xs text-slate-400 flex justify-between py-1 border-t">
                <span>Differenz (Gewinn/Verlust):</span>
                <span class="font-semibold ${item.sellPrice - item.buyPrice >= 0 ? 'text-emerald-600' : 'text-rose-500'}">
                  ${formatEUR(item.sellPrice - item.buyPrice)}
                </span>
              </div>
              ` : ''}
            </div>
          </div>
          
          <div class="p-4 border-t bg-slate-50 flex justify-end gap-2">
            <button onclick="editItem('${item.id}')" class="text-slate-500 hover:text-indigo-600 p-1 text-sm font-medium"><i class="fa-regular fa-pen-to-square"></i> Bearbeiten</button>
            <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-500 p-1 text-sm font-medium"><i class="fa-regular fa-trash-can"></i></button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Modal & Formular Logik
    const modal = document.getElementById('item-modal');
    
    function openModal() {
      document.getElementById('item-form').reset();
      document.getElementById('item-id').value = '';
      document.getElementById('item-image-base64').value = '';
      document.getElementById('image-preview-wrapper').classList.add('hidden');
      document.getElementById('modal-title').innerText = 'Neuen Artikel erfassen';
      document.getElementById('item-date').value = new Date().toISOString().split('T')[0];
      toggleSoldInputs();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleSoldInputs() {
      const isSold = document.getElementById('item-is-sold').checked;
      const soldFields = document.getElementById('sold-fields');
      soldFields.classList.toggle('hidden', !isSold);
    }

    // Bildverarbeitung (Kompression)
    function handleImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 500;
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
          canvas.height = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          const compressed = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('item-image-base64').value = compressed;
          document.getElementById('image-preview').src = compressed;
          document.getElementById('image-preview-wrapper').classList.remove('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      document.getElementById('item-image').value = '';
      document.getElementById('item-image-base64').value = '';
      document.getElementById('image-preview-wrapper').classList.add('hidden');
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('item-id').value;
      const title = document.getElementById('item-title').value;
      const desc = document.getElementById('item-desc').value;
      const buyPrice = parseFloat(document.getElementById('item-buy-price').value) || 0;
      const date = document.getElementById('item-date').value;
      const isSold = document.getElementById('item-is-sold').checked;
      const sellPrice = isSold ? (parseFloat(document.getElementById('item-sell-price').value) || 0) : 0;
      const image = document.getElementById('item-image-base64').value;

      if (id) {
        const index = items.findIndex(i => i.id === id);
        if (index !== -1) {
          items[index] = { ...items[index], title, desc, buyPrice, date, isSold, sellPrice, image: image || items[index].image };
        }
      } else {
        items.push({
          id: Date.now().toString(),
          title, desc, buyPrice, date, isSold, sellPrice, image
        });
      }

      saveToStorage();
      closeModal();
    }

    function editItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      openModal();
      document.getElementById('modal-title').innerText = 'Artikel bearbeiten';
      document.getElementById('item-id').value = item.id;
      document.getElementById('item-title').value = item.title;
      document.getElementById('item-desc').value = item.desc || '';
      document.getElementById('item-buy-price').value = item.buyPrice;
      document.getElementById('item-date').value = item.date || '';
      document.getElementById('item-is-sold').checked = item.isSold;
      document.getElementById('item-sell-price').value = item.sellPrice || '';

      if (item.image) {
        document.getElementById('item-image-base64').value = item.image;
        document.getElementById('image-preview').src = item.image;
        document.getElementById('image-preview-wrapper').classList.remove('hidden');
      }

      toggleSoldInputs();
    }

    function deleteItem(id) {
      if (confirm('Möchtest du diesen Artikel wirklich löschen?')) {
        items = items.filter(i => i.id !== id);
        saveToStorage();
      }
    }

    // Backup & Restore
    function exportBackup() {
      if (items.length === 0) {
        alert('Es sind noch keine Artikel zum Exportieren vorhanden.');
        return;
      }

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
      const downloadAnchor = document.createElement('a');
      const dateStr = new Date().toISOString().split('T')[0];
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `kidsgear_backup_${dateStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('import-file-input').click();
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (!Array.isArray(importedData)) {
            throw new Error('Ungültiges Datenformat. Es wird eine Liste von Artikeln erwartet.');
          }

          const shouldMerge = confirm(
            `${importedData.length} Artikel in der Backup-Datei gefunden!\n\n` +
            `• Klicke "OK", um die neuen Daten zu deinen bestehenden HINZUZUFÜGEN (Zusammenführen).\n` +
            `• Klicke "Abbrechen", um die bestehenden Daten komplett durch das Backup zu ERSETZEN.`
          );

          if (shouldMerge) {
            const existingIds = new Set(items.map(i => i.id));
            let addedCount = 0;

            importedData.forEach(item => {
              if (!existingIds.has(item.id)) {
                items.push(item);
                addedCount++;
              }
            });
            alert(`Erfolg: ${addedCount} neue Artikel wurden hinzugefügt!`);
          } else {
            items = importedData;
            alert('Erfolg: Alle Daten wurden durch das Backup ersetzt!');
          }

          saveToStorage();
        } catch (err) {
          alert('Fehler beim Einlesen der Backup-Datei: ' + err.message);
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    calculateTotals();
    renderItems();
  </script>
</body>
</html>
